<style>
.dgm-gwx{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-danger-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative}
.dgm-gwx-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-danger-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:20px;padding:3px 12px;box-shadow:0 2px 6px color-mix(in oklab, var(--color-background-danger-solid) 28%, transparent)}
.dgm-gwx h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-gwx-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-gwx-q{background:var(--color-surface-tertiary);border:1px dashed var(--color-border);border-radius:10px;padding:9px 14px;text-align:center;
  font-size:11px;font-weight:700;color:var(--color-text);margin-bottom:10px}
.dgm-gwx-branches{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dgm-gwx-b{border-radius:11px;padding:11px 13px;border:1.5px solid}
.dgm-gwx-b h6{margin:0 0 4px;font-size:10.5px;font-weight:700}
.dgm-gwx-b p{margin:0;font-size:10px;color:var(--color-text-secondary);line-height:1.35}
.dgm-gwx-b.accent{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface)}
.dgm-gwx-b.accent h6{color:var(--color-text-danger)}
.dgm-gwx-b.blue{background:var(--color-background-info-surface);border-color:var(--color-border-info-surface)}
.dgm-gwx-b.blue h6{color:var(--color-text-info)}
.dgm-gwx-b.green{background:var(--color-background-success-surface);border-color:var(--color-border-success-surface)}
.dgm-gwx-b.green h6{color:var(--color-text-success)}
.dgm-gwx-b.red{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface)}
.dgm-gwx-b.red h6{color:var(--color-text-danger)}
.dgm-gwx-b.neutral{background:var(--color-surface-tertiary);border-color:var(--color-border)}
.dgm-gwx-b.neutral h6{color:var(--color-text)}
@media (max-width:640px){.dgm-gwx{padding:20px 16px 18px}.dgm-gwx-branches{grid-template-columns:1fr}}
</style>
<div class="dgm-gwx">
  <span class="dgm-gwx-chip">Exclusive gateway (XOR)</span>
  <h4>Pick exactly one path</h4>
  <p class="dgm-gwx-sub">The token takes yes or no — never both.</p>
  <div class="dgm-gwx-q">score ≥ 700?</div>
  <div class="dgm-gwx-branches">
    <div class="dgm-gwx-b green">
      <h6>Yes</h6>
      <p>Auto approve</p>
    </div>
    <div class="dgm-gwx-b accent">
      <h6>No</h6>
      <p>Manual review</p>
    </div>
  </div>
</div>
