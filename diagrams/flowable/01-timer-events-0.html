<style>
.dgm-te{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-danger-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative}
.dgm-te-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-danger-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:20px;padding:3px 12px;box-shadow:0 2px 6px color-mix(in oklab, var(--color-background-danger-solid) 28%, transparent)}
.dgm-te h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-te-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-te-q{background:var(--color-surface-tertiary);border:1px dashed var(--color-border);border-radius:10px;padding:9px 14px;text-align:center;
  font-size:11px;font-weight:700;color:var(--color-text);margin-bottom:10px}
.dgm-te-branches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dgm-te-b{border-radius:11px;padding:11px 13px;border:1.5px solid}
.dgm-te-b h6{margin:0 0 4px;font-size:10.5px;font-weight:700}
.dgm-te-b p{margin:0;font-size:10px;color:var(--color-text-secondary);line-height:1.35}
.dgm-te-b.accent{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface)}
.dgm-te-b.accent h6{color:var(--color-text-danger)}
.dgm-te-b.blue{background:var(--color-background-info-surface);border-color:var(--color-border-info-surface)}
.dgm-te-b.blue h6{color:var(--color-text-info)}
.dgm-te-b.green{background:var(--color-background-success-surface);border-color:var(--color-border-success-surface)}
.dgm-te-b.green h6{color:var(--color-text-success)}
.dgm-te-b.red{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface)}
.dgm-te-b.red h6{color:var(--color-text-danger)}
.dgm-te-b.neutral{background:var(--color-surface-tertiary);border-color:var(--color-border)}
.dgm-te-b.neutral h6{color:var(--color-text)}
@media (max-width:640px){.dgm-te{padding:20px 16px 18px}.dgm-te-branches{grid-template-columns:1fr}}
</style>
<div class="dgm-te">
  <span class="dgm-te-chip">Three timer shapes</span>
  <h4>What fires when</h4>
  <p class="dgm-te-sub">Duration and cycle are relative to arming; date is the only absolute one.</p>
  <div class="dgm-te-branches">
    <div class="dgm-te-b blue">
      <h6>Duration — PT4H / P30D</h6>
      <p>Once, relative to arming</p>
    </div>
    <div class="dgm-te-b accent">
      <h6>Date — 2026-08-01T09:00Z</h6>
      <p>Once, absolute</p>
    </div>
    <div class="dgm-te-b green">
      <h6>Cycle — R3/P1D</h6>
      <p>N times, one interval apart</p>
    </div>
  </div>
</div>
