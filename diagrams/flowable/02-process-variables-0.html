<style>
.dgm-pv{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-danger-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative}
.dgm-pv-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-danger-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:20px;padding:3px 12px;box-shadow:0 2px 6px color-mix(in oklab, var(--color-background-danger-solid) 28%, transparent)}
.dgm-pv h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-pv-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-pv-chain{display:flex;flex-direction:column;gap:2px}
.dgm-pv-node{background:var(--color-background-danger-surface);border:1.5px solid var(--color-border-danger-surface);border-radius:10px;padding:9px 14px;
  font-weight:700;font-size:11px;color:var(--color-text-danger)}
.dgm-pv-node.alt{background:var(--color-surface-tertiary);border-color:var(--color-border);color:var(--color-text)}
.dgm-pv-arr{display:flex;justify-content:center;color:var(--color-text-tertiary);padding:1px 0;font-size:9.5px;text-align:center}
@media (max-width:640px){.dgm-pv{padding:20px 16px 18px}}
.dgm-pv-cols{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dgm-pv-col{border-radius:12px;padding:12px 13px;border:1.5px solid}
.dgm-pv-col.neutral{background:var(--color-surface-tertiary);border-color:var(--color-border)}
.dgm-pv-col.accent{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface)}
.dgm-pv-col.blue{background:var(--color-background-info-surface);border-color:var(--color-border-info-surface)}
.dgm-pv-col.green{background:var(--color-background-success-surface);border-color:var(--color-border-success-surface)}
.dgm-pv-col h6{margin:0 0 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.dgm-pv-col.neutral h6{color:var(--color-text-secondary)}
.dgm-pv-col.accent h6{color:var(--color-text-danger)}
.dgm-pv-col.blue h6{color:var(--color-text-info)}
.dgm-pv-col.green h6{color:var(--color-text-success)}
.dgm-pv-item{background:var(--color-surface);border:1px solid var(--color-border-info-surface);border-radius:8px;padding:6px 9px;font-size:10px;
  color:var(--color-text);line-height:1.35;margin-bottom:5px}
.dgm-pv-item:last-child{margin-bottom:0}
.dgm-pv-link{display:flex;justify-content:center;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.3px;padding:6px 0}
@media (max-width:640px){.dgm-pv{padding:20px 16px 18px}.dgm-pv-cols{grid-template-columns:1fr}}
</style>
<div class="dgm-pv">
  <span class="dgm-pv-chip">Variable scoping</span>
  <h4>Each branch gets its own private copy of local variables</h4>
  <p class="dgm-pv-sub">Reading walks up to instance scope; writing to a local name never leaks across branches.</p>
  <div class="dgm-pv-chain">
    <div class="dgm-pv-node accent">Instance scope — applicant, amount</div>
  </div>
  <div class="dgm-pv-cols">
    <div class="dgm-pv-col blue">
      <h6>Credit branch scope</h6>
      <div class="dgm-pv-item">attempt (local)</div>
    </div>
    <div class="dgm-pv-col green">
      <h6>KYC branch scope</h6>
      <div class="dgm-pv-item">attempt (local)</div>
    </div>
  </div>
</div>
