<style>
.dgm-gwp{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-danger-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative}
.dgm-gwp-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-danger-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:20px;padding:3px 12px;box-shadow:0 2px 6px color-mix(in oklab, var(--color-background-danger-solid) 28%, transparent)}
.dgm-gwp h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-gwp-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-gwp-row{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.dgm-gwp-n{background:var(--color-surface-tertiary);border:1px solid var(--color-border);border-radius:9px;padding:9px 11px;text-align:center;
  font-size:10.5px;font-weight:700;color:var(--color-text);line-height:1.3}
.dgm-gwp-n.accent{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface);color:var(--color-text-danger)}
.dgm-gwp-n.blue{background:var(--color-background-info-surface);border-color:var(--color-border-info-surface);color:var(--color-text-info)}
.dgm-gwp-n.green{background:var(--color-background-success-surface);border-color:var(--color-border-success-surface);color:var(--color-text-success)}
.dgm-gwp-n.red{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface);color:var(--color-text-danger)}
.dgm-gwp-arr{color:var(--color-text-tertiary);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.dgm-gwp-arr .lbl{font-size:8.5px;font-weight:700;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.3px}
@media (max-width:640px){.dgm-gwp{padding:20px 16px 18px}.dgm-gwp-row{flex-direction:column}}
.dgm-gwp-cols{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dgm-gwp-col{border-radius:12px;padding:12px 13px;border:1.5px solid}
.dgm-gwp-col.neutral{background:var(--color-surface-tertiary);border-color:var(--color-border)}
.dgm-gwp-col.accent{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface)}
.dgm-gwp-col.blue{background:var(--color-background-info-surface);border-color:var(--color-border-info-surface)}
.dgm-gwp-col.green{background:var(--color-background-success-surface);border-color:var(--color-border-success-surface)}
.dgm-gwp-col h6{margin:0 0 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.dgm-gwp-col.neutral h6{color:var(--color-text-secondary)}
.dgm-gwp-col.accent h6{color:var(--color-text-danger)}
.dgm-gwp-col.blue h6{color:var(--color-text-info)}
.dgm-gwp-col.green h6{color:var(--color-text-success)}
.dgm-gwp-item{background:var(--color-surface);border:1px solid var(--color-border-info-surface);border-radius:8px;padding:6px 9px;font-size:10px;
  color:var(--color-text);line-height:1.35;margin-bottom:5px}
.dgm-gwp-item:last-child{margin-bottom:0}
.dgm-gwp-link{display:flex;justify-content:center;color:var(--color-text-tertiary);font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.3px;padding:6px 0}
@media (max-width:640px){.dgm-gwp{padding:20px 16px 18px}.dgm-gwp-cols{grid-template-columns:1fr}}
</style>
<div class="dgm-gwp">
  <span class="dgm-gwp-chip">Parallel gateway (AND)</span>
  <h4>Fork now, wait for every branch before continuing</h4>
  <p class="dgm-gwp-sub">Both paths run; the join doesn't fire until credit check AND KYC check complete.</p>
  <div class="dgm-gwp-row"><div class="dgm-gwp-n accent">⥂ Fork</div></div>
  <div class="dgm-gwp-cols">
    <div class="dgm-gwp-col blue">
      <h6>Credit check</h6>
    </div>
    <div class="dgm-gwp-col green">
      <h6>KYC check</h6>
    </div>
  </div>
  <div class="dgm-gwp-row" style="margin-top:8px"><div class="dgm-gwp-n accent">⥃ Join — waits for both</div><span class="dgm-gwp-arr">→</span><div class="dgm-gwp-n">Continue</div></div>
</div>
