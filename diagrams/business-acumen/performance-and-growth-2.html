<style>
.ba-vc{background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;
  padding:24px 22px 18px;margin:26px 0;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04)}
.ba-vc-title{font-size:var(--font-text-xs-size);letter-spacing:.06em;text-transform:uppercase;
  color:var(--color-text-secondary);font-weight:700;margin:0 0 4px}
.ba-vc-sub{font-size:var(--font-text-sm-size);color:var(--color-text-secondary);margin:0 0 10px}
.ba-vc svg{width:100%;height:auto;display:block;max-width:40em;margin:0 auto}
.ba-vc .grid{stroke:var(--color-border);stroke-width:1}
.ba-vc .axis{stroke:var(--color-text-tertiary);stroke-width:1.2}
.ba-vc .lbl{fill:var(--color-text-secondary)}
.ba-vc .ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ba-vc .v1{stroke:var(--color-text-success)}
.ba-vc .v2{stroke:var(--color-text-warning)}
.ba-vc .v3{stroke:var(--color-text-danger)}
.ba-vc .proj{stroke-dasharray:5 5;stroke-width:2}
.ba-vc .d1{fill:var(--color-text-success)}
.ba-vc .d2{fill:var(--color-text-warning)}
.ba-vc .d3{fill:var(--color-text-danger)}
.ba-vc .mark{stroke:var(--color-text-info);stroke-width:1.4;stroke-dasharray:3 4}
.ba-vc .marklbl{fill:var(--color-text-info);font-weight:700}
.ba-vc-legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.ba-vc-chip{font-size:var(--font-text-xs-size);font-weight:600;border-radius:20px;padding:3px 10px;border:1px solid}
.ba-vc-chip.s{background:var(--color-background-success-surface);border-color:var(--color-border-success-surface);color:var(--color-text-success)}
.ba-vc-chip.w{background:var(--color-background-warning-surface);border-color:var(--color-border-warning-surface);color:var(--color-text-warning)}
.ba-vc-chip.d{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface);color:var(--color-text-danger)}
.ba-vc-chip.i{background:var(--color-background-info-surface);border-color:var(--color-border-info-surface);color:var(--color-text-info)}
@media (max-width:640px){.ba-vc{padding:18px 12px 14px}}
</style>
<div class="ba-vc" role="figure" aria-label="Vintage curves: cumulative net charge-off by months on book for three illustrative quarterly vintages">
  <div class="ba-vc-title">Vintage curves · illustrative</div>
  <p class="ba-vc-sub">Cumulative net charge-off (% of original balance) by months on book. Compare at the same age, never on the calendar.</p>
  <svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
    <line class="grid" x1="50" y1="160" x2="360" y2="160"/>
    <line class="grid" x1="50" y1="120" x2="360" y2="120"/>
    <line class="grid" x1="50" y1="80" x2="360" y2="80"/>
    <line class="grid" x1="50" y1="40" x2="360" y2="40"/>
    <line class="axis" x1="50" y1="200" x2="360" y2="200"/>
    <line class="axis" x1="50" y1="200" x2="50" y2="34"/>
    <text class="lbl" x="42" y="204" font-size="11" text-anchor="end">0%</text>
    <text class="lbl" x="42" y="164" font-size="11" text-anchor="end">1%</text>
    <text class="lbl" x="42" y="124" font-size="11" text-anchor="end">2%</text>
    <text class="lbl" x="42" y="84" font-size="11" text-anchor="end">3%</text>
    <text class="lbl" x="42" y="44" font-size="11" text-anchor="end">4%</text>
    <text class="lbl" x="50" y="217" font-size="11" text-anchor="middle">0</text>
    <text class="lbl" x="125" y="217" font-size="11" text-anchor="middle">3</text>
    <text class="lbl" x="200" y="217" font-size="11" text-anchor="middle">6</text>
    <text class="lbl" x="275" y="217" font-size="11" text-anchor="middle">9</text>
    <text class="lbl" x="350" y="217" font-size="11" text-anchor="middle">12</text>
    <text class="lbl" x="205" y="234" font-size="11" text-anchor="middle">Months on book</text>
    <line class="mark" x1="200" y1="200" x2="200" y2="34"/>
    <text class="marklbl" x="204" y="30" font-size="10">same age: 0.8 · 1.0 · 1.3</text>
    <polyline class="ln v1" points="50,200 125,192 200,168 275,136 350,104"/>
    <polyline class="ln v2" points="50,200 125,188 200,160 275,124"/>
    <polyline class="ln v3" points="50,200 125,184 200,148"/>
    <polyline class="ln v3 proj" points="200,148 350,44"/>
    <circle class="d1" cx="350" cy="104" r="3.5"/>
    <circle class="d2" cx="275" cy="124" r="3.5"/>
    <circle class="d3" cx="200" cy="148" r="3.5"/>
    <text class="lbl" x="356" y="108" font-size="10">V1 2.4%</text>
    <text class="lbl" x="281" y="128" font-size="10">V2 1.9%</text>
    <text class="lbl" x="300" y="52" font-size="10">V3 ≈ 3.9%?</text>
  </svg>
  <div class="ba-vc-legend">
    <span class="ba-vc-chip s">V1 · oldest, 12 months seen</span>
    <span class="ba-vc-chip w">V2 · 9 months seen</span>
    <span class="ba-vc-chip d">V3 · 6 months seen · dashed = projection</span>
    <span class="ba-vc-chip i">Pricing assumed about 3% at month 12</span>
  </div>
</div>
