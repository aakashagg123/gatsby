<style>
.dgm-ml{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-discovery-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative;color:var(--color-text)}
.dgm-ml-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-discovery-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-radius:20px;padding:3px 12px}
.dgm-ml h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-ml-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-ml-grid{display:grid;gap:12px}
.dgm-ml-card{border-radius:13px;padding:13px 14px;background:var(--color-surface-secondary);border:1px solid var(--color-border);position:relative}
.dgm-ml-card h5{margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--color-text)}
.dgm-ml-card p{margin:0;font-size:11.5px;line-height:1.4;color:var(--color-text-secondary)}
.dgm-ml-num{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;margin-right:6px;
  font-size:10.5px;font-weight:700;background:var(--color-background-discovery-surface);color:var(--color-text-discovery)}
.dgm-ml-ok{background:var(--color-background-success-surface);border-color:var(--color-border-success-surface)}
.dgm-ml-bad{background:var(--color-background-danger-surface);border-color:var(--color-border-danger-surface)}
.dgm-ml-info{background:var(--color-background-info-surface);border-color:var(--color-border-info-surface)}
.dgm-ml-warn{background:var(--color-background-caution-surface);border-color:var(--color-border-caution-surface)}
.dgm-ml-arrow{display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary);font-size:16px}
.dgm-ml-foot{margin:14px 0 0;font-size:11px;color:var(--color-text-tertiary);text-align:center}
@media (max-width:640px){.dgm-ml{padding:22px 16px 18px}}
.tn-row{display:grid;gap:12px}
.tn-5{grid-template-columns:repeat(5,1fr)}.tn-3{grid-template-columns:repeat(3,1fr)}.tn-2{grid-template-columns:1fr 1fr}
.tn-mono{font-family:var(--font-mono);font-size:11px;color:var(--color-text);background:var(--color-surface-tertiary);border-radius:6px;padding:1px 6px;display:inline-block;margin:2px 0}
.tn-big{font-size:15px;font-weight:700;color:var(--color-text)}
@media (max-width:760px){.tn-5{grid-template-columns:repeat(2,1fr)}.tn-3{grid-template-columns:1fr}}
@media (max-width:520px){.tn-5,.tn-2{grid-template-columns:1fr}}
</style>
<div class="dgm-ml"><span class="dgm-ml-chip">Where the bytes go</span>
<h4>Three piles scale with the model, one with the batch</h4>
<p class="dgm-ml-sub">Top: bit layouts. Bottom: model state per parameter.</p>

 style="fill:var(--color-text-secondary);font-size:11px">bfloat16</text><g transform="translate(90,0)"><rect x="0" y="0" width="5.5" height="26" style="fill:var(--color-background-discovery-surface);stroke:var(--color-border)"/><text x="2.75" y="17" text-anchor="middle" style="fill:var(--color-text);font-size:10px;font-weight:600">s</text><rect x="5.5" y="0" width="44.0" height="26" style="fill:var(--color-background-warning-surface);stroke:var(--color-border)"/><text x="27.5" y="17" text-anchor="middle" style="fill:var(--color-text);font-size:10px;font-weight:600">exp 8</text><rect x="49.5" y="0" width="38.5" height="26" style="fill:var(--color-background-info-surface);stroke:var(--color-border)"/><text x="68.75" y="17" text-anchor="middle" style="fill:var(--color-text);font-size:10px;font-weight:600">fraction 7</text></g></g><text x="6" y="141" style="fill:var(--color-text-secondary);font-size:11px">bytes / param</text><rect x="90" y="124" width="50" height="26" style="fill:var(--color-background-info-surface);stroke:var(--color-border)"/><text x="115.0" y="141" text-anchor="middle" style="fill:var(--color-text);font-size:10px;font-weight:600">weights 2</text><rect x="142" y="124" width="50" height="26" style="fill:var(--color-background-success-surface)"/><text x="167.0" y="141" text-anchor="middle" style="fill:var(--color-text);font-size:10px;font-weight:600">grads 2</text><rect x="194" y="124" width="310" height="26" style="fill:var(--color-background-caution-surface)"/><text x="349.0" y="141" text-anchor="middle" style="fill:var(--color-text);font-size:10px;font-weight:600">optimizer 12</text><text x="512" y="141" style="fill:var(--color-text);font-size:11px;font-weight:700">= 16</text><text x="90" y="170" style="fill:var(--color-text-tertiary);font-size:10px">mixed precision + Adam. Activations come on top and grow with the batch.</text></svg>
<p class="dgm-ml-foot">1.5 billion parameters × 16 bytes ≈ 24 GB before activations</p>
</div>
