<style>
.dgm-mmap{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-warning-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative}
.dgm-mmap-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-warning-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:20px;padding:3px 12px;box-shadow:0 2px 6px color-mix(in oklab, var(--color-background-warning-solid) 28%, transparent)}
.dgm-mmap h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-mmap-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-mmap-box{background:var(--color-background-warning-surface);border:1.5px dashed var(--color-border-warning-outline);border-radius:12px;padding:14px}
.dgm-mmap-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--color-text-warning);
  text-align:center;margin-bottom:8px}
.dgm-mmap-row{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.dgm-mmap-n{background:var(--color-surface);border:1px solid var(--color-border-warning-outline);border-radius:9px;padding:9px 11px;text-align:center;
  font-size:10px;font-weight:700;color:var(--color-text-warning)}
.dgm-mmap-arr{color:var(--color-text-tertiary);font-size:9px;text-align:center}
.dgm-mmap-io{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.dgm-mmap-n2{background:var(--color-surface-tertiary);border:1px solid var(--color-border);border-radius:9px;padding:8px 10px;text-align:center;
  font-size:10px;font-weight:700;color:var(--color-text)}
@media (max-width:640px){.dgm-mmap{padding:20px 16px 18px}.dgm-mmap-row{flex-direction:column}}
</style>
<div class="dgm-mmap">
  <span class="dgm-mmap-chip">Single-server mmap architecture</span>
  <h4>In-process nanoseconds beat network microseconds</h4>
  <p class="dgm-mmap-sub">Shared memory means zero-copy handoffs between components.</p>

  <div class="dgm-mmap-io">
    <div class="dgm-mmap-n2">Gateway — network I/O</div>
  </div>
  <div class="dgm-mmap-arr">↓</div>

  <div class="dgm-mmap-box">
    <div class="dgm-mmap-lbl">Single server</div>
    <div class="dgm-mmap-row">
      <div class="dgm-mmap-n">Sequencer — assign order</div>
      <span class="dgm-mmap-arr">mmap →</span>
      <div class="dgm-mmap-n">Order book — matching engine</div>
      <span class="dgm-mmap-arr">mmap →</span>
      <div class="dgm-mmap-n">Trade reporter</div>
    </div>
  </div>

  <div class="dgm-mmap-arr">↓</div>
  <div class="dgm-mmap-io">
    <div class="dgm-mmap-n2">Market data publisher</div>
  </div>
</div>
