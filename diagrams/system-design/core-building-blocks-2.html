<style>
.dgm-hr{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-warning-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative}
.dgm-hr-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-warning-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:20px;padding:3px 12px;box-shadow:0 2px 6px color-mix(in oklab, var(--color-background-warning-solid) 28%, transparent)}
.dgm-hr h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-hr-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-hr-ring{position:relative;width:220px;height:220px;margin:10px auto 14px;border:2px dashed var(--color-border-warning-outline);border-radius:50%}
.dgm-hr-srv{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--color-background-warning-solid);color:var(--white);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;transform:translate(-50%,-50%)}
.dgm-hr-key{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--color-background-info-solid);color:var(--white);
  display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;transform:translate(-50%,-50%);
  border:2px solid var(--color-border)}
.dgm-hr-legend{display:flex;justify-content:center;gap:16px;font-size:10px;color:var(--color-text-secondary);margin-bottom:10px}
.dgm-hr-legend span{display:inline-flex;align-items:center;gap:5px}
.dgm-hr-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dgm-hr-map{display:flex;flex-direction:column;gap:5px}
.dgm-hr-row{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--color-text);background:var(--color-surface-tertiary);
  border:1px solid var(--color-border);border-radius:8px;padding:7px 10px}
.dgm-hr-row b{color:var(--color-text-info)}
@media (max-width:640px){.dgm-hr{padding:20px 16px 18px}.dgm-hr-ring{width:180px;height:180px}}
</style>
<div class="dgm-hr">
  <span class="dgm-hr-chip">The hash ring</span>
  <h4>Walk clockwise from the key's position until you hit a server</h4>
  <p class="dgm-hr-sub">Only the keys between the changed server and its neighbor need to move.</p>

  <div class="dgm-hr-ring">
    <div class="dgm-hr-srv" style="top:0%;left:50%">A</div>
    <div class="dgm-hr-srv" style="top:75%;left:93%">B</div>
    <div class="dgm-hr-srv" style="top:83%;left:15%">C</div>
    <div class="dgm-hr-key" style="top:12%;left:80%">K1</div>
    <div class="dgm-hr-key" style="top:55%;left:97%">K2</div>
    <div class="dgm-hr-key" style="top:35%;left:8%">K3</div>
  </div>
  <div class="dgm-hr-legend">
    <span><i class="dgm-hr-dot" style="background:var(--color-background-warning-solid)"></i>Server</span>
    <span><i class="dgm-hr-dot" style="background:var(--color-background-info-solid)"></i>Key</span>
  </div>

  <div class="dgm-hr-map">
    <div class="dgm-hr-row">Key 1 (hash: 45°) → walks CW → <b>Server B</b></div>
    <div class="dgm-hr-row">Key 2 (hash: 130°) → walks CW → <b>Server C</b></div>
    <div class="dgm-hr-row">Key 3 (hash: 330°) → walks CW → <b>Server A</b></div>
  </div>
</div>
