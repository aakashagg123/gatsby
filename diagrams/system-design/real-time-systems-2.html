<style>
.dgm-pr4{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-warning-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative}
.dgm-pr4-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-warning-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:20px;padding:3px 12px;box-shadow:0 2px 6px color-mix(in oklab, var(--color-background-warning-solid) 28%, transparent)}
.dgm-pr4 h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-pr4-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-pr4-row{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.dgm-pr4-n{background:var(--color-surface-tertiary);border:1px solid var(--color-border);border-radius:9px;padding:9px 11px;text-align:center;
  font-size:10px;font-weight:700;color:var(--color-text)}
.dgm-pr4-n.pub{background:var(--color-background-warning-surface);border-color:var(--color-border-warning-outline);color:var(--color-text-warning)}
.dgm-pr4-arr{color:var(--color-text-tertiary)}
.dgm-pr4-fanout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dgm-pr4-f{background:var(--color-surface);border:1px solid var(--color-border-warning-outline);border-radius:9px;padding:8px 8px;text-align:center;
  font-size:9.5px;color:var(--color-text-warning)}
@media (max-width:640px){.dgm-pr4{padding:20px 16px 18px}.dgm-pr4-row{flex-direction:column}.dgm-pr4-fanout{grid-template-columns:1fr}}
</style>
<div class="dgm-pr4">
  <span class="dgm-pr4-chip">Online presence</span>
  <h4>Heartbeat every 5s · offline after 30s of silence</h4>
  <p class="dgm-pr4-sub">A status change fans out to every online friend's chat server.</p>

  <div class="dgm-pr4-row">
    <div class="dgm-pr4-n">User Client</div>
    <span class="dgm-pr4-arr">heartbeat every 5s →</span>
    <div class="dgm-pr4-n">Presence Service</div>
    <span class="dgm-pr4-arr">status change →</span>
    <div class="dgm-pr4-n pub">Pub/Sub Channel</div>
  </div>

  <div class="dgm-pr4-fanout">
    <div class="dgm-pr4-f">Friend 1's chat server</div>
    <div class="dgm-pr4-f">Friend 2's chat server</div>
    <div class="dgm-pr4-f">Friend N's chat server</div>
  </div>
</div>
