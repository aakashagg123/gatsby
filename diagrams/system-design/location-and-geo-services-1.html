<style>
.dgm-nb{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-warning-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative}
.dgm-nb-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-warning-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:20px;padding:3px 12px;box-shadow:0 2px 6px color-mix(in oklab, var(--color-background-warning-solid) 28%, transparent)}
.dgm-nb h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-nb-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-nb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:340px;margin:0 auto}
.dgm-nb-cell{background:var(--color-surface-tertiary);border:1px solid var(--color-border);border-radius:9px;padding:14px 6px;text-align:center;
  font-size:10px;font-weight:700;color:var(--color-text-secondary)}
.dgm-nb-cell.center{background:var(--color-background-warning-surface);border:1.5px solid var(--color-border-warning-outline);color:var(--color-text-warning)}
.dgm-nb-note{margin-top:12px;padding:10px 14px;background:var(--color-surface-tertiary);border:1px dashed var(--color-border);border-radius:10px;
  font-size:10.5px;color:var(--color-text);line-height:1.4;text-align:center}
@media (max-width:640px){.dgm-nb{padding:20px 16px 18px}}
</style>
<div class="dgm-nb">
  <span class="dgm-nb-chip">The boundary problem</span>
  <h4>Query the target cell and all 8 neighbors</h4>
  <p class="dgm-nb-sub">A point 50m away across a cell boundary must not be missed.</p>

  <div class="dgm-nb-grid">
    <div class="dgm-nb-cell">NW</div><div class="dgm-nb-cell">N</div><div class="dgm-nb-cell">NE</div>
    <div class="dgm-nb-cell">W</div><div class="dgm-nb-cell center">Target cell — user's geohash</div><div class="dgm-nb-cell">E</div>
    <div class="dgm-nb-cell">SW</div><div class="dgm-nb-cell">S</div><div class="dgm-nb-cell">SE</div>
  </div>

  <div class="dgm-nb-note">9 prefix lookups, still fast on an indexed column — any point within the search radius falls within one of these 9 cells.</div>
</div>
