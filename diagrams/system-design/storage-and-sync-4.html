<style>
.dgm-walm{background:var(--color-surface);border:1px solid var(--color-border);border-top:3px solid var(--color-border-warning-outline);
  border-radius:16px;padding:28px 26px 22px;box-shadow:0 1px 3px rgb(var(--shadow-color) / 0.04),0 8px 24px rgb(var(--shadow-color) / 0.04);
  margin:26px 0;max-width:100%;font-family:inherit;text-align:left;position:relative}
.dgm-walm-chip{position:absolute;top:-11px;left:24px;background:var(--color-background-warning-solid);color:var(--white);
  font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  border-radius:20px;padding:3px 12px;box-shadow:0 2px 6px color-mix(in oklab, var(--color-background-warning-solid) 28%, transparent)}
.dgm-walm h4{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--color-text-secondary)}
.dgm-walm-sub{font-size:12px;color:var(--color-text-secondary);margin:0 0 16px}
.dgm-walm-in{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.dgm-walm-o{background:var(--color-surface-tertiary);border:1px solid var(--color-border);border-radius:8px;padding:8px 10px;text-align:center;
  font-size:9.5px;font-weight:700;color:var(--color-text)}
.dgm-walm-arr{text-align:center;color:var(--color-text-tertiary);font-size:11px;margin-bottom:8px}
.dgm-walm-file{background:var(--color-background-warning-surface);border:1.5px solid var(--color-border-warning-outline);border-radius:10px;padding:11px 14px;
  font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:10px;color:var(--color-text-warning);line-height:1.7}
@media (max-width:640px){.dgm-walm{padding:20px 16px 18px}}
</style>
<div class="dgm-walm">
  <span class="dgm-walm-chip">WAL-style file merging</span>
  <h4>Random writes become sequential appends</h4>
  <p class="dgm-walm-sub">Small objects share one large WAL file instead of one file each.</p>

  <div class="dgm-walm-in">
    <div class="dgm-walm-o">obj-a · 2 KB</div>
    <div class="dgm-walm-o">obj-b · 500 B</div>
    <div class="dgm-walm-o">obj-c · 8 KB</div>
  </div>
  <div class="dgm-walm-arr">↓ appended sequentially ↓</div>

  <div class="dgm-walm-file">
    offset 0: obj-a (2 KB)<br/>
    offset 2048: obj-b (512 B)<br/>
    offset 2560: obj-c (8 KB)
  </div>
</div>
